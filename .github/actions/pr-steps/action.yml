name: PR step status
description: Update the checks table in the pull request comment.

inputs:
  step:
    description: init, install, lint, test, or build
    required: true
  state:
    description: waiting, running, success, failure, skipped, or cancelled. Not used for init.
    required: false
    default: waiting

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        STEP: ${{ inputs.step }}
        NEXT_STATE: ${{ inputs.state }}
      with:
        script: |
          const step = process.env.STEP;
          const nextState = process.env.NEXT_STATE;
          const names = ["install", "lint", "test", "build"];
          const labels = { install: "Install", lint: "Lint", test: "Test", build: "Build" };
          const text = {
            waiting: "⚪ Waiting",
            running: "🟡 In progress",
            success: "🟢 Success",
            failure: "🔴 Failed",
            skipped: "⏭️ Skipped",
            cancelled: "🚫 Cancelled",
          };
          const markers = ["<!-- scribo-checks", "<!-- scribo-deployment"];

          function emptyState() {
            return { sha: "", install: "waiting", lint: "waiting", test: "waiting", build: "waiting" };
          }

          // Unknown keys (the old deploy row) are ignored, so an old comment is
          // rewritten in the new format on the next update.
          function readState(body) {
            const state = emptyState();
            const match = body?.match(/<!-- scribo-(?:checks|deployment) ([^>]*?)-->/);
            if (!match) return state;
            for (const part of match[1].trim().split(/\s+/)) {
              const eq = part.indexOf("=");
              if (eq === -1) continue;
              const key = part.slice(0, eq);
              const value = part.slice(eq + 1);
              if (key === "sha" && /^[0-9a-f]{40}$/.test(value)) state.sha = value;
              if (names.includes(key) && text[value]) state[key] = value;
            }
            return state;
          }

          function apply(state, runSha) {
            if (state.sha !== runSha || step === "init") {
              Object.assign(state, emptyState(), { sha: runSha });
            }
            if (step === "init") return true;
            if (!names.includes(step) || !text[nextState]) {
              core.setFailed(`Unknown step status: ${step}=${nextState}`);
              return false;
            }
            state[step] = nextState;
            return true;
          }

          function render(state, runUrl) {
            const encoded = [`sha=${state.sha}`]
              .concat(names.map((name) => `${name}=${state[name]}`))
              .join(" ");
            const rows = names
              .map((name) => `| ${labels[name]} | ${text[state[name]]} |`)
              .join("\n");
            return [
              `<!-- scribo-checks ${encoded} -->`,
              "### Checks",
              "",
              "| Step | Status |",
              "| --- | --- |",
              rows,
              "",
              `Commit \`${state.sha.slice(0, 7)}\` · [Workflow run](${runUrl})`,
              "",
            ].join("\n");
          }

          const { owner, repo } = context.repo;
          const pullRequest = context.payload.pull_request;
          if (!pullRequest) {
            core.info("Not a pull request run, the checks table is not updated.");
            return;
          }

          // A newer push makes this run stale. It must not overwrite the table
          // that the newer run is filling in.
          const runSha = pullRequest.head.sha;
          const live = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: pullRequest.number,
          });
          if (live.data.head.sha !== runSha) return;

          // Only comments written by the workflow count, so a pasted marker
          // from a person is never picked up. Pagination covers long threads.
          async function findTables() {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            return comments.filter(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                markers.some((marker) => comment.body?.includes(marker)),
            );
          }

          // Two runs can both see no table and both create one. The oldest
          // comment is kept, so every run converges on the same one.
          async function dropDuplicates(tables) {
            for (const extra of tables.slice(1)) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: extra.id });
              } catch (error) {
                core.warning(`Could not delete duplicate table ${extra.id}: ${error.message}`);
              }
            }
          }

          const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const tables = await findTables();
          const existing = tables[0];
          const state = readState(existing?.body);
          if (!apply(state, runSha)) return;
          const body = render(state, runUrl);

          if (!existing) {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequest.number,
              body,
            });
            await dropDuplicates(await findTables());
          } else {
            if (existing.body !== body) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            }
            await dropDuplicates(tables);
          }
