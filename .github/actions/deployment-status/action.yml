name: Deployment status
description: Record a Building, Ready, Error, or Cancelled deployment for this repository.

inputs:
  state:
    description: Building, Ready, Error, or Cancelled
    required: true
  service:
    description: Service name shown in the summary
    required: true
  environment:
    description: Production, Staging, or Preview
    required: true
  deployment_id:
    description: Existing deployment id. Empty for the first status.
    required: false
    default: ""
  url:
    description: Site URL for the Ready status
    required: false
    default: ""

outputs:
  deployment_id:
    description: GitHub deployment id
    value: ${{ steps.status.outputs.deployment_id }}

runs:
  using: composite
  steps:
    - id: status
      uses: actions/github-script@v7
      env:
        STATE_LABEL: ${{ inputs.state }}
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
        SITE_URL: ${{ inputs.url }}
        DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      with:
        script: |
          const stateLabel = process.env.STATE_LABEL;
          const service = process.env.SERVICE;
          const environment = process.env.ENVIRONMENT;
          const siteUrl = process.env.SITE_URL;
          let deploymentId = process.env.DEPLOYMENT_ID;

          const apiStates = {
            Building: "in_progress",
            Ready: "success",
            Error: "failure",
            Cancelled: "inactive",
          };
          const apiState = apiStates[stateLabel];
          if (!apiState) {
            core.setFailed(`Unknown deployment state: ${stateLabel}`);
            return;
          }

          const { owner, repo } = context.repo;
          const logUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          const ref = context.payload.pull_request?.head?.sha || context.sha;

          if (!deploymentId) {
            const created = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref,
              environment,
              auto_merge: false,
              required_contexts: [],
              description: stateLabel,
              production_environment: environment === "Production",
              transient_environment: environment === "Preview",
            });
            if (!created.data.id) {
              core.setFailed("GitHub did not create a deployment");
              return;
            }
            deploymentId = String(created.data.id);
          }

          const status = {
            owner,
            repo,
            deployment_id: Number(deploymentId),
            state: apiState,
            description: stateLabel,
            log_url: logUrl,
            auto_inactive: false,
          };
          if (apiState === "success" && siteUrl) {
            status.environment_url = siteUrl;
          }
          await github.rest.repos.createDeploymentStatus(status);

          // A finished deployment replaces the earlier ones of the same
          // environment that lead up to this commit. Deployments of other
          // branches are not ancestors of it, so they are left alone, and
          // deployments that are still running are never touched.
          if (apiState === "success") {
            const listed = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment,
              per_page: 30,
            });
            for (const deployment of listed.data) {
              if (String(deployment.id) === String(deploymentId)) continue;
              let related = deployment.sha === ref;
              if (!related) {
                try {
                  const compared = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${deployment.sha}...${ref}`,
                  });
                  related = compared.data.status === "ahead";
                } catch {
                  related = false;
                }
              }
              if (!related) continue;
              const { data: previous } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1,
              });
              const latest = previous[0];
              if (!latest || latest.state === "inactive") continue;
              if (["in_progress", "queued", "pending"].includes(latest.state)) continue;
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Replaced",
                auto_inactive: false,
              });
            }
          }

          core.setOutput("deployment_id", deploymentId);
          const urlCell = apiState === "success" && siteUrl ? siteUrl : "—";
          await core.summary
            .addHeading(environment)
            .addTable([
              [
                { data: "Service", header: true },
                { data: "Status", header: true },
                { data: "URL", header: true },
              ],
              [service, stateLabel, urlCell],
            ])
            .write();
