
name: Reopen issues closed by non-collaborators

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  reopen:
    name: Reopen
    runs-on: ubuntu-latest
    steps:
      - name: Reopen unless the actor can write
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor
            let permission = "none"
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor,
              })
              permission = data.permission
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (["admin", "maintain", "write"].includes(permission)) return

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "open",
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Закрыть issue может только участник с правом записи. Issue снова открыта.",
            })
