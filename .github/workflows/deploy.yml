
name: Deploy

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "stack=prod" >> "$GITHUB_OUTPUT"
            echo "environment=Production" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo.pp.ua" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
            echo "stack=stage" >> "$GITHUB_OUTPUT"
            echo "environment=Staging" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo-stage.pp.ua" >> "$GITHUB_OUTPUT"
          fi

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: socket
          environment: ${{ steps.target.outputs.environment }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Docker build
        run: |
          docker build \
            -t "ghcr.io/scribo-blog-org/socket:${{ github.sha }}" \
            -t "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}" \
            .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push "ghcr.io/scribo-blog-org/socket:${{ github.sha }}"
          docker push "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          STACK: ${{ steps.target.outputs.stack }}
          SERVICE: socket
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: STACK,SERVICE
          script: |
            set -eu
            cd /srv/scribo/infra
            ./scribo pull "$STACK" "$SERVICE"
            ./scribo up "$STACK" "$SERVICE"
            docker image prune -f
            for attempt in $(seq 1 36); do
              health=$(docker inspect -f '{{.State.Health.Status}}' "$STACK-$SERVICE" 2>/dev/null || echo missing)
              if [ "$health" = healthy ]; then
                echo "$STACK-$SERVICE is healthy"
                exit 0
              fi
              sleep 5
            done
            echo "$STACK-$SERVICE did not become healthy: $health" >&2
            docker logs --tail 50 "$STACK-$SERVICE" >&2 || true
            exit 1

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          url: ${{ steps.target.outputs.url }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Cancelled
        if: cancelled()
        uses: ./.github/actions/deployment-status
        with:
          state: Cancelled
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
