# Выкладка socket-service.
# master → тег latest и сразу поднимает прод.
# dev → тег staging. Контейнер стейджа пересоздаётся только если стейдж уже запущен.
# Job один: падение lint, test или сборки останавливает пайплайн до push и SSH.

name: Deploy

on:
  push:
    branches:
      - master
      - dev

# Встроенный GITHUB_TOKEN может публиковать образ в ghcr.io этого репозитория
permissions:
  contents: read
  packages: write
  deployments: write
  pull-requests: write

jobs:
  deploy:
    # Машина на Oracle Cloud Free Tier — это Ampere, то есть aarch64.
    # Сборка на x86-раннере дала бы образ, который там не запускается.
    runs-on: ubuntu-24.04-arm
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "stack=prod" >> "$GITHUB_OUTPUT"
            echo "environment=Production" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo-blog.duckdns.org" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
            echo "stack=stage" >> "$GITHUB_OUTPUT"
            echo "environment=Staging" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo-blog-stage.duckdns.org" >> "$GITHUB_OUTPUT"
          fi

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: socket
          environment: ${{ steps.target.outputs.environment }}

      # Версия из package.json engines: "node": "22.x". Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Без успешного lint дальше job не идёт
      - name: Lint
        run: npm run lint

      # Без успешного шага test образ не собирается и не выкатывается
      - name: Test
        run: npm run test

      # Два тега одного образа: неизменяемый sha коммита и latest либо staging
      - name: Docker build
        run: |
          docker build \
            -t "ghcr.io/scribo-blog-org/socket:${{ github.sha }}" \
            -t "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}" \
            .

      # Вход в GHCR встроенным токеном Actions. Отдельный PAT не нужен
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация обоих тегов. Ошибка push останавливает job до SSH
      - name: Push images
        run: |
          docker push "ghcr.io/scribo-blog-org/socket:${{ github.sha }}"
          docker push "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}"

      # Стеки описаны одним compose-файлом, поэтому окружение выбирается целью,
      # а имя сервиса в обоих одинаковое. Без prune диск забивается слоями
      # node_modules от предыдущего тега.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          STACK: ${{ steps.target.outputs.stack }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: STACK
          script: |
            set -eu
            cd /srv/scribo/infra
            ./scribo pull "$STACK" socket
            ./scribo up "$STACK" socket
            docker image prune -f

      - name: Record deploy success
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: deploy
          state: success

      - name: Record deploy failure
        if: failure()
        uses: ./.github/actions/pr-steps
        with:
          step: deploy
          state: failure

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          url: ${{ steps.target.outputs.url }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
