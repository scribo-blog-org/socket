# Выкладка socket-service при push в master.
# Job один: падение lint, test или сборки останавливает пайплайн до push и SSH.

name: Deploy

on:
  push:
    branches:
      - master

# Встроенный GITHUB_TOKEN может публиковать образ в ghcr.io этого репозитория
permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: socket
          environment: Production

      # Версия из package.json engines: "node": "22.x". Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Без успешного lint дальше job не идёт
      - name: Lint
        run: npm run lint

      # Без успешного шага test образ не собирается и не выкатывается
      - name: Test
        run: npm run test

      # Два тега одного образа: неизменяемый sha коммита и latest
      - name: Docker build
        run: |
          docker build \
            -t "ghcr.io/scribo-blog-org/socket:${{ github.sha }}" \
            -t "ghcr.io/scribo-blog-org/socket:latest" \
            .

      # Вход в GHCR встроенным токеном Actions. Отдельный PAT не нужен
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация обоих тегов. Ошибка push останавливает job до SSH
      - name: Push images
        run: |
          docker push "ghcr.io/scribo-blog-org/socket:${{ github.sha }}"
          docker push "ghcr.io/scribo-blog-org/socket:latest"

      # Хост, пользователь и публичный ключ из секрета. Приватный ключ в лог не пишется.
      - name: Show SSH identity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          python3 -c 'import os; print("SSH_HOST:", " ".join(os.environ.get("SSH_HOST",""))); print("SSH_USER:", " ".join(os.environ.get("SSH_USER","")))'
          keyfile=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          echo "public key from SSH_PRIVATE_KEY:"
          ssh-keygen -y -f "$keyfile"
          echo "fingerprint:"
          ssh-keygen -l -f "$keyfile"
          rm -f "$keyfile"

      # На сервере образ socket закреплён как :latest. Отдельного .env с тегом нет.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/scribo &&
            docker compose pull socket &&
            docker compose up -d socket &&
            docker image prune -f

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: socket
          environment: Production
          url: https://scribo-blog.duckdns.org
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: socket
          environment: Production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
