# Выкладка socket-service.
# master → тег latest и сразу поднимает прод.
# dev → тег staging. Контейнер стейджа пересоздаётся только если стейдж уже запущен.
# Job один: падение lint, test или сборки останавливает пайплайн до push и SSH.

name: Deploy

on:
  push:
    branches:
      - master
      - dev

# Встроенный GITHUB_TOKEN может публиковать образ в ghcr.io этого репозитория
permissions:
  contents: read
  packages: write
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
            echo "compose_service=socket" >> "$GITHUB_OUTPUT"
            echo "environment=Production" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo-blog.duckdns.org" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
            echo "compose_file=docker-compose.stage.yml" >> "$GITHUB_OUTPUT"
            echo "compose_service=stage-socket" >> "$GITHUB_OUTPUT"
            echo "environment=Staging" >> "$GITHUB_OUTPUT"
            echo "url=https://scribo-blog-stage.duckdns.org" >> "$GITHUB_OUTPUT"
          fi

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: socket
          environment: ${{ steps.target.outputs.environment }}

      # Версия из package.json engines: "node": "22.x". Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Без успешного lint дальше job не идёт
      - name: Lint
        run: npm run lint

      # Без успешного шага test образ не собирается и не выкатывается
      - name: Test
        run: npm run test

      # Два тега одного образа: неизменяемый sha коммита и latest либо staging
      - name: Docker build
        run: |
          docker build \
            -t "ghcr.io/scribo-blog-org/socket:${{ github.sha }}" \
            -t "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}" \
            .

      # Вход в GHCR встроенным токеном Actions. Отдельный PAT не нужен
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публикация обоих тегов. Ошибка push останавливает job до SSH
      - name: Push images
        run: |
          docker push "ghcr.io/scribo-blog-org/socket:${{ github.sha }}"
          docker push "ghcr.io/scribo-blog-org/socket:${{ steps.target.outputs.image_tag }}"

      # Хост, пользователь и публичный ключ из секрета. Приватный ключ в лог не пишется.
      - name: Show SSH identity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          python3 -c 'import os; print("SSH_HOST:", " ".join(os.environ.get("SSH_HOST",""))); print("SSH_USER:", " ".join(os.environ.get("SSH_USER","")))'
          keyfile=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          echo "public key from SSH_PRIVATE_KEY:"
          ssh-keygen -y -f "$keyfile"
          echo "fingerprint:"
          ssh-keygen -l -f "$keyfile"
          rm -f "$keyfile"

      # master всегда поднимает socket.
      # dev скачивает stage-socket и пересоздаёт его, только если стейдж уже запущен.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPOSE_FILE: ${{ steps.target.outputs.compose_file }}
          COMPOSE_SERVICE: ${{ steps.target.outputs.compose_service }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: COMPOSE_FILE,COMPOSE_SERVICE
          script: |
            set -eu
            cd /opt/scribo
            docker compose -f "$COMPOSE_FILE" pull "$COMPOSE_SERVICE"
            if [ "$COMPOSE_FILE" = "docker-compose.yml" ] || [ -n "$(docker compose -f "$COMPOSE_FILE" ps --status running -q)" ]; then
              docker compose -f "$COMPOSE_FILE" up -d "$COMPOSE_SERVICE"
            fi
            docker image prune -f

      - name: Record deploy success
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: deploy
          state: success

      - name: Record deploy failure
        if: failure()
        uses: ./.github/actions/pr-steps
        with:
          step: deploy
          state: failure

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          url: ${{ steps.target.outputs.url }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: socket
          environment: ${{ steps.target.outputs.environment }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
