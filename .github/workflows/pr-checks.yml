# Проверки pull request в master для socket-service.
# Образ собирается локально и не публикуется. Ненулевой код любого шага роняет job.

name: PR checks

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build
    # Тот же aarch64, что и на машине: иначе PR собирал бы не тот образ,
    # который поедет в прод.
    runs-on: ubuntu-24.04-arm
    steps:
      # Код репозитория на раннере
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checks
        uses: ./.github/actions/pr-steps
        with:
          step: init

      - name: Building
        id: deployment
        uses: ./.github/actions/deployment-status
        with:
          state: Building
          service: socket
          environment: Preview

      # Версия из package.json engines: "node": "22.x". Кэш npm по package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      # Зависимости строго по lock-файлу
      - name: Install dependencies
        run: npm ci

      # Линтера в репозитории нет: в package.json стоит плейсхолдер с кодом 0
      - name: Lint running
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: running

      - name: Lint
        id: lint
        run: npm run lint

      - name: Lint status
        if: steps.lint.outcome == 'success' || steps.lint.outcome == 'failure'
        uses: ./.github/actions/pr-steps
        with:
          step: lint
          state: ${{ steps.lint.outcome }}

      # Тестов нет: в package.json стоит плейсхолдер с кодом 0
      - name: Test running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: running

      - name: Test
        id: test
        run: npm run test

      - name: Test status
        if: steps.test.outcome == 'success' || steps.test.outcome == 'failure'
        uses: ./.github/actions/pr-steps
        with:
          step: test
          state: ${{ steps.test.outcome }}

      # Сборка по локальному Dockerfile. В registry ничего не уходит
      - name: Build running
        if: success()
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: running

      - name: Docker build
        id: build
        run: docker build -t "${{ github.repository }}:pr-${{ github.event.number }}" .

      - name: Build status
        if: steps.build.outcome == 'success' || steps.build.outcome == 'failure'
        uses: ./.github/actions/pr-steps
        with:
          step: build
          state: ${{ steps.build.outcome }}

      - name: Mark failed checks
        if: failure()
        uses: ./.github/actions/pr-steps
        with:
          step: fail

      - name: Ready
        if: success()
        uses: ./.github/actions/deployment-status
        with:
          state: Ready
          service: socket
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Error
        if: failure()
        uses: ./.github/actions/deployment-status
        with:
          state: Error
          service: socket
          environment: Preview
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
